{% extends 'layout.html' %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
    
    <div class="mb-3">
            <a href="{{ url_for('admin_dashboard') }}" class="btn btn-outline-secondary btn-sm shadow-sm">
                <i class="bi bi-arrow-left"></i> Voltar para o Painel
            </a>
        </div>

    <div class="col-md-5 col-lg-4">
        <div class="card shadow-lg border-0 rounded-4 p-4">
            <div class="text-center mb-4"><h2 class="fw-bold h4">Acessar Painel</h2></div>
            <form method="POST">
                <div class="mb-3"><label class="form-label small fw-bold">Usuário</label><input type="text" class="form-control form-control-lg" name="username" required></div>
                <div class="mb-4"><label class="form-label small fw-bold">Senha</label><input type="password" class="form-control form-control-lg" name="password" required></div>
		<div class="text-end mt-1 mb-3">
    		<a href="{{ url_for('recuperar_senha') }}" class="small text-decoration-none">Esqueci a minha senha</a>
	</div>
                <button class="btn btn-dark w-100 py-3 fw-bold rounded-3">Entrar</button>
            </form>
            <div class="text-center mt-4 border-top pt-3"><a href="{{ url_for('planos') }}" class="text-decoration-none small text-body-secondary">Não tem conta? <span class="text-blue-600 fw-bold">Teste grátis</span></a></div>
        </div>
    </div>
</div>
{% endblock %}
