{% extends 'layout.html' %}
{% block title %}Recuperar Senha{% endblock %}
{% block content %}
<div class="container py-5 d-flex justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="card shadow-sm border-0" style="max-width: 400px; width: 100%;">
        <div class="card-body p-4 p-md-5">
            <div class="text-center mb-4">
                <div class="bg-primary bg-opacity-10 d-inline-block p-3 rounded-circle mb-3">
                    <i class="bi bi-key fs-1 text-primary"></i>
                </div>
                <h3 class="fw-bold">Recuperar Senha</h3>
                <p class="text-body-secondary small">Digite o e-mail cadastrado e enviaremos uma senha temporária de acesso.</p>
            </div>
            
            <form action="{{ url_for('recuperar_senha') }}" method="POST">
                <div class="mb-3">
                    <label class="form-label fw-bold small">O seu E-mail</label>
                    <input type="email" name="email" class="form-control" placeholder="exemplo@email.com" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 fw-bold py-2 mb-3">Enviar Nova Senha</button>
            </form>
            
	    

            <div class="text-center border-top pt-3 mt-2">
                <a href="{{ url_for('login') }}" class="small text-decoration-none text-body-secondary"><i class="bi bi-arrow-left"></i> Voltar para o Login</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
