{% extends 'layout.html' %}
{% block title %}Alterar Senha{% endblock %}
{% block content %}
<div class="container py-4" style="max-width: 800px;">
    <div class="d-flex align-items-center mb-4 gap-3">
        <div class="bg-primary bg-opacity-10 p-3 rounded-circle text-primary shadow-sm">
            <i class="bi bi-shield-lock fs-3"></i>
        </div>
        <div>
            <h2 class="h3 mb-0 fw-bold text-body-emphasis">Segurança e Senha</h2>
            <p class="text-body-secondary mb-0">Atualize a sua senha de acesso ao painel da Agenda Fácil.</p>
        </div>
    </div>

    <div class="row">
        <div class="col-md-8 col-lg-7">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4 p-md-5">
                    <form method="POST">
                        <div class="mb-4">
                            <label class="form-label fw-bold small text-body-secondary">Senha Atual</label>
                            <input type="password" name="senha_atual" class="form-control form-control-lg bg-body-tertiary" required>
                        </div>
                        
                        <hr class="text-body-secondary opacity-25 my-4">
                        
                        <div class="mb-3">
                            <label class="form-label fw-bold small text-body-secondary">Nova Senha</label>
                            <input type="password" name="nova_senha" class="form-control form-control-lg" placeholder="Mínimo 6 caracteres" required minlength="6">
                        </div>
                        
                        <div class="mb-4">
                            <label class="form-label fw-bold small text-body-secondary">Confirmar Nova Senha</label>
                            <input type="password" name="confirmar_senha" class="form-control form-control-lg" required minlength="6">
                        </div>
                        
                        <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold shadow-sm">
                            Guardar Nova Senha
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
